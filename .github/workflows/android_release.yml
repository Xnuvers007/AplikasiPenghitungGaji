name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:   # Bisa dijalankan manual dari GitHub Actions tab

# ── WAJIB: beri izin write agar bot bisa buat tag & release ────────────────
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Ambil semua history agar kita bisa baca tag lama

      # ── 2. Setup Java (sesuai compileOptions di build.gradle.kts) ───────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 3. Tentukan tag versi berikutnya (V1.0 → V1.1 → V1.2 dst) ──────
      - name: Determine next version tag
        id: version
        run: |
          # Ambil semua tag yang cocok pola V<angka>.<angka>
          LAST_TAG=$(git tag --list 'V*.*' | sort -t'.' -k1,1V -k2,2n | tail -1)

          if [ -z "$LAST_TAG" ]; then
            # Belum ada tag sama sekali → mulai dari V1.0
            NEXT_TAG="V1.0"
          else
            # Pisahkan major.minor
            MAJOR=$(echo "$LAST_TAG" | grep -oP '(?<=V)\d+(?=\.)')
            MINOR=$(echo "$LAST_TAG" | grep -oP '\d+$')
            NEXT_MINOR=$((MINOR + 1))
            NEXT_TAG="V${MAJOR}.${NEXT_MINOR}"
          fi

          echo "NEXT_TAG=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Next release tag: $NEXT_TAG"

      # ── 4. Buat gradlew bisa di-execute ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 5. Build debug APK (tidak perlu keystore) ───────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ── 6. Rename APK sesuai versi ──────────────────────────────────────
      - name: Rename APK
        id: rename_apk
        run: |
          TAG="${{ steps.version.outputs.NEXT_TAG }}"
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_DST="AplikasiPenghitungGaji-${TAG}-debug.apk"
          cp "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_DST" >> $GITHUB_OUTPUT

      # ── 7. Buat Git Tag ─────────────────────────────────────────────────
      - name: Create Git Tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.NEXT_TAG }}"
          # Gunakan URL yang sudah embed GITHUB_TOKEN agar push terautentikasi
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "${{ steps.version.outputs.NEXT_TAG }}"

      # ── 8. Generate Release Notes & Publish ke GitHub Releases ──────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.version.outputs.NEXT_TAG }}
          name:       "Release ${{ steps.version.outputs.NEXT_TAG }}"
          body: |
            ## 🚀 Aplikasi Penghitung Gaji — ${{ steps.version.outputs.NEXT_TAG }}

            ### ✅ Perubahan di rilis ini
            - Build otomatis dari branch `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Dipicu oleh: `${{ github.actor }}`

            ### 📦 File APK
            | File | Keterangan |
            |------|-----------|
            | `${{ steps.rename_apk.outputs.APK_NAME }}` | Debug APK — langsung bisa install |

            ### 📲 Cara Install
            1. Download APK di bawah
            2. Aktifkan *"Install dari sumber tidak dikenal"* di pengaturan HP
            3. Buka file APK dan install

            ---
            > _Release ini dibuat secara otomatis oleh GitHub Actions._
          files: ${{ steps.rename_apk.outputs.APK_PATH }}
          generate_release_notes: true   # Tambahkan auto-generated PR/commit notes dari GitHub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
